<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>오일파스텔 아트 스튜디오 (Mobile)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Nanum Gothic', sans-serif;
      user-select: none;
      background-color: #0f172a;
      color: #e2e8f0;
    }
    header {
      background: linear-gradient(90deg, #11182d, #17172d);
      border-bottom: 1px solid rgba(148,163,184,.18);
    }
    .canvas-container {
      position: relative;
      background-color: #efece4 !important;
      background-image:
        radial-gradient(rgba(91,72,45,.12) .7px, transparent .9px),
        radial-gradient(rgba(255,255,255,.65) .7px, transparent .9px) !important;
      background-size: 9px 9px, 15px 15px !important;
      background-position: 0 0, 4px 6px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    canvas, #canvas-wrapper {
      touch-action: none;
    }
    .paper-texture {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; opacity: 0.15;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.6"/></svg>');
    }
    .tool-btn {
      background: linear-gradient(145deg, #202635, #171c28);
      border: 1px solid #30394b;
      color: #dbe4f0;
      min-height: 52px;
    }
    .tool-btn.active {
      background: linear-gradient(145deg, #635bdf, #4338ca) !important;
      border-color: #818cf8 !important;
      color: white !important;
      box-shadow: 0 4px 12px rgba(79,70,229,.35);
    }
    .mopv-swatch {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.12);
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 1px;
    }
    .mopv-swatch.selected {
      outline: 2px solid #6366f1;
      outline-offset: 1px;
      transform: scale(1.08);
      z-index: 3;
    }
    .mopv-swatch span {
      font-size: 8px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 0 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    /* Mobile Sliding Bottom Sheet */
    .mobile-drawer {
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      max-height: 55dvh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px;
      z-index: 40;
      transform: translateY(120%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
    }
    .mobile-drawer.open {
      transform: translateY(0);
    }
    .impasto-brush-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
    }
    .impasto-preset {
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .impasto-preset.active {
      border: 2px solid #818cf8;
      background: #312e81;
    }
    .impasto-preset-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a5b4fc;
      font-size: 12px;
      flex-shrink: 0;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    /* Tailwind CDN이 늦게 뜨거나 차단돼도 항상 동작하도록 하는 안전망 */
    .hidden { display: none !important; }
    button, [role="button"], .tool-btn, .nav-tab-btn, .mopv-swatch,
    .impasto-preset, .drawer-close-btn, #color-number-apply, label[for], input[type="range"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    /* 버튼/드로어는 항상 캔버스보다 위에서 터치를 받도록 z-index만 명시 (position은 기존 값 유지) */
    header { position: relative; z-index: 30; }
    nav { position: relative; z-index: 45; }
    .mobile-drawer { z-index: 40; }
    #login-modal { z-index: 60; }
  </style>
</head>
<body class="flex flex-col h-full w-full select-none overflow-hidden">

  <!-- Mobile Top Header Bar -->
  <header class="px-4 py-2.5 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="p-1.5 bg-indigo-700 rounded-lg">
        <i class="fa-solid fa-palette text-amber-300 text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold leading-none text-white">오일파스텔 모바일</h1>
        <p id="user-badge-text" class="text-[10px] text-indigo-300 mt-0.5">로그인 필요</p>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="flex items-center space-x-1.5">
      <button id="undo-btn" class="p-2 bg-indigo-950 hover:bg-indigo-800 border border-indigo-700 rounded-lg text-xs text-indigo-200" title="실행취소">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="clear-btn" class="p-2 bg-indigo-950 hover:bg-rose-900 border border-rose-800 text-rose-300 rounded-lg text-xs" title="전체 지우기">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button id="download-btn" class="px-2.5 py-1.5 bg-amber-500 text-indigo-950 font-bold rounded-lg text-xs flex items-center gap-1">
        <i class="fa-solid fa-download"></i> 저장
      </button>
    </div>
  </header>

  <!-- Center: Main Drawing Canvas Area -->
  <main class="flex-1 relative flex items-center justify-center bg-slate-950 overflow-hidden">
    <!-- Zoom HUD HUD Badge -->
    <div class="absolute top-3 left-3 z-10 bg-slate-900/80 text-slate-200 text-[10px] px-2.5 py-1 rounded-full border border-slate-700 backdrop-blur-sm pointer-events-none flex items-center gap-1.5">
      <i class="fa-solid fa-magnifying-glass text-indigo-400"></i>
      <span id="zoom-val">100%</span>
      <span class="text-slate-500">| 두 손가락 핀치 줌</span>
    </div>

    <div id="canvas-wrapper" class="canvas-container rounded-xl overflow-hidden relative" style="width: 606px; height: 860px;">
      <div id="canvas-transform-layer" class="w-full h-full relative origin-center transition-transform duration-75">
        <canvas id="main-canvas" width="606" height="860" class="block w-full h-full"></canvas>
        <div class="paper-texture"></div>
      </div>
    </div>
  </main>

  <!-- Bottom Mobile Drawer Sheets (Sliding Panels) -->
  
  <!-- Panel 1: 표현 기법 (Tools) -->
  <div id="drawer-tools" class="mobile-drawer">
    <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-2">
      <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5"><i class="fa-solid fa-paintbrush"></i> 표현 기법 선택</h3>
      <button class="drawer-close-btn text-xs text-slate-400 p-1"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button data-tool="basic" class="tool-btn active p-2 border rounded-xl flex items-center justify-center text-xs font-bold gap-2">
        <i class="fa-solid fa-pen-nib"></i> 기본 오일파스텔
      </button>
      <button data-tool="scratch" class="tool-btn p-2 border rounded-xl flex items-center justify-center text-xs font-bold gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> 스크래치 툴
      </button>
      <button data-tool="impasto" class="tool-btn p-2 border rounded-xl flex items-center justify-center text-xs font-bold gap-2">
        <i class="fa-solid fa-cubes-stacked"></i> 임파스토
      </button>
      <button data-tool="smudge" class="tool-btn p-2 border rounded-xl flex items-center justify-center text-xs font-bold gap-2">
        <i class="fa-solid fa-hand-back-fist text-amber-500"></i> 스머지
      </button>
    </div>
    <!-- Slider Settings -->
    <div class="space-y-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
      <div>
        <div class="flex justify-between text-xs font-bold mb-1"><span>붓 크기</span><span id="brush-size-val" class="text-indigo-400">20px</span></div>
        <input type="range" id="brush-size" min="5" max="80" value="20" class="w-full accent-indigo-500">
      </div>
      <div>
        <div class="flex justify-between text-xs font-bold mb-1"><span>밀도/불투명도</span><span id="brush-opacity-val" class="text-indigo-400">90%</span></div>
        <input type="range" id="brush-opacity" min="10" max="100" value="90" class="w-full accent-indigo-500">
      </div>
      <div class="pt-2 border-t border-slate-800">
        <div class="flex justify-between text-xs font-bold"><span>필압 (Pressure)</span><span id="pressure-meter-val" class="text-indigo-400">-</span></div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden mt-1"><div id="pressure-meter-fill" class="h-full bg-indigo-500" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- Panel 2: 임파스토 브러시 (Impasto Presets) -->
  <div id="drawer-impasto" class="mobile-drawer">
    <div class="flex items-center justify-between mb-2 border-b border-slate-700/60 pb-2">
      <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5"><i class="fa-solid fa-layer-group"></i> 임파스토 브러시 (4대 범주)</h3>
      <button class="drawer-close-btn text-xs text-slate-400 p-1"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>
    <div class="impasto-brush-grid" id="impasto-brush-grid"></div>
  </div>

  <!-- Panel 3: 색상 팔레트 (Palette) -->
  <div id="drawer-color" class="mobile-drawer">
    <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-2">
      <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5"><i class="fa-solid fa-palette"></i> MOPV 72색 팔레트</h3>
      <button class="drawer-close-btn text-xs text-slate-400 p-1"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>
    <div class="flex items-center gap-3 mb-3 bg-slate-900/60 p-2 rounded-xl border border-slate-800">
      <label class="text-xs font-bold">주 색상</label>
      <input type="color" id="primary-color" value="#2563eb" class="w-8 h-8 rounded border-none bg-transparent cursor-pointer">
      <div class="flex-1 flex gap-1">
        <input type="text" id="color-number-input" placeholder="번호 (예: 221)" class="w-full px-2 py-1 bg-slate-800 border border-slate-700 rounded text-xs">
        <button id="color-number-apply" class="px-3 py-1 bg-indigo-600 rounded text-xs font-bold shrink-0">선택</button>
      </div>
    </div>
    <div id="mopv-color-grid" class="grid grid-cols-6 gap-1 max-h-48 overflow-y-auto p-1 bg-slate-900 rounded-xl border border-slate-800"></div>
    <p id="mopv-selected-info" class="mt-2 text-[11px] text-slate-400 font-semibold text-center"></p>
  </div>

  <!-- Panel 4: 참고 그림 & 스포이드 (Reference) -->
  <div id="drawer-ref" class="mobile-drawer">
    <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-2">
      <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5"><i class="fa-solid fa-image"></i> 참고 그림 & 스포이드</h3>
      <button class="drawer-close-btn text-xs text-slate-400 p-1"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>
    <label class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-indigo-900/50 border border-indigo-700 text-indigo-200 font-bold text-xs rounded-xl cursor-pointer mb-2">
      <i class="fa-solid fa-upload"></i> 참고 이미지 업로드
      <input type="file" id="ref-image-input" accept="image/*" class="hidden">
    </label>
    <div id="ref-image-container" class="relative bg-slate-900 border border-slate-700 rounded-xl overflow-hidden min-h-[140px] flex items-center justify-center">
      <img id="ref-image" class="hidden max-h-[180px] w-full object-contain" alt="참고 이미지">
      <div id="ref-placeholder" class="text-center p-3 text-slate-500 text-xs">사진을 업로드하면 터치하여 색상을 추출할 수 있습니다.</div>
    </div>
    <div id="eyedropper-badge" class="mt-2 bg-slate-900 border border-slate-800 rounded-lg p-2 flex items-center justify-between text-xs">
      <span class="text-slate-400 font-bold">추출 색:</span>
      <div class="flex items-center space-x-2">
        <div id="picked-color-swatch" class="w-4 h-4 rounded-full border border-slate-600 bg-blue-600"></div>
        <span id="picked-color-code" class="font-mono text-[11px] text-slate-300">#2563EB</span>
      </div>
    </div>
  </div>

  <!-- Mobile Fixed Bottom Navigation Bar -->
  <nav class="h-[60px] bg-slate-900 border-t border-slate-800 flex items-center justify-around px-2 z-50 shrink-0">
    <button data-target="drawer-tools" class="nav-tab-btn flex flex-col items-center gap-1 text-slate-400 text-[10px] font-bold py-1 px-3">
      <i class="fa-solid fa-paintbrush text-base"></i><span>기법/붓</span>
    </button>
    <button data-target="drawer-impasto" class="nav-tab-btn flex flex-col items-center gap-1 text-slate-400 text-[10px] font-bold py-1 px-3">
      <i class="fa-solid fa-layer-group text-base"></i><span>임파스토</span>
    </button>
    <button data-target="drawer-color" class="nav-tab-btn flex flex-col items-center gap-1 text-slate-400 text-[10px] font-bold py-1 px-3">
      <i class="fa-solid fa-palette text-base"></i><span>팔레트</span>
    </button>
    <button data-target="drawer-ref" class="nav-tab-btn flex flex-col items-center gap-1 text-slate-400 text-[10px] font-bold py-1 px-3">
      <i class="fa-solid fa-image text-base"></i><span>참고그림</span>
    </button>
    <button id="btn-close-all" class="flex flex-col items-center gap-1 text-indigo-400 text-[10px] font-bold py-1 px-3">
      <i class="fa-solid fa-eye text-base"></i><span>캔버스만</span>
    </button>
  </nav>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 text-white rounded-2xl shadow-2xl p-6 w-full max-w-sm border border-slate-800">
      <div class="text-center mb-4">
        <div class="w-12 h-12 bg-indigo-900/80 text-indigo-400 rounded-xl flex items-center justify-center mx-auto mb-2 border border-indigo-700">
          <i class="fa-solid fa-mobile-screen-button text-2xl"></i>
        </div>
        <h3 class="text-lg font-bold">오일파스텔 스튜디오</h3>
        <p class="text-xs text-slate-400 mt-1">학번과 이름을 입력해주세요.</p>
      </div>
      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">학번 (예: 20101)</label>
          <input type="text" id="student-id" required placeholder="학번 5자리" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">이름 (예: 홍길동)</label>
          <input type="text" id="student-name" required placeholder="이름 입력" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition mt-2">
          스튜디오 입장하기
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2 border border-slate-700">
    <i class="fa-solid fa-circle-info text-amber-400"></i><span id="toast-msg">알림</span>
  </div>

  <script>
    // 어디서든 즉시 쓸 수 있게 toast 함수를 최상단에 먼저 정의
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (!toast || !toastMsg) { console.warn(msg); return; }
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }
    // 스크립트 어디서든 오류가 나면 화면에 바로 표시 (기존엔 오류 발생 시 이후 코드가
    // 전혀 실행되지 않아 "버튼이 눌리지 않는" 것처럼 보였음)
    window.addEventListener('error', (e) => {
      console.error(e.error || e.message);
      showToast('오류 발생: ' + (e.message || '알 수 없는 오류'));
    });

    const state = {
      studentId: '', studentName: '',
      tool: 'basic', primaryColor: '#2563eb',
      brushSize: 20, opacity: 0.9,
      isDrawing: false, lastX: 0, lastY: 0,
      history: [], historyIndex: -1, maxHistory: 10,
      zoom: 1.0, panX: 0, panY: 0,
      strokeStack: [], pressure: 0.6,
      impastoBrush: 'dabber_round',
      canvasPreset: 'a5', canvasOrientation: 'portrait'
    };

    const CANVAS_SIZE_PRESETS = { a5: { ratio: 148 / 210 } };
    const CANVAS_LONG_EDGE = 860;

    const MOPV_COLORS = [
      { num: 201, name: 'Lemon Yellow', hex: '#f9f052' },
      { num: 202, name: 'Yellow', hex: '#fee207' },
      { num: 205, name: 'Orange', hex: '#ef7f11' },
      { num: 208, name: 'Scarlet', hex: '#e0132c' },
      { num: 210, name: 'Purple', hex: '#a80f6b' },
      { num: 218, name: 'Ultramarine Blue', hex: '#11338c' },
      { num: 221, name: 'Cobalt Blue', hex: '#09519d' },
      { num: 228, name: 'Grass Green', hex: '#008e47' },
      { num: 236, name: 'Brown', hex: '#652e21' },
      { num: 244, name: 'White', hex: '#fefefe' },
      { num: 248, name: 'Black', hex: '#010201' }
    ];

    const IMPASTO_PRESETS = [
      { id: 'dabber_round', name: 'Round Dabber', icon: 'fa-circle', type: 'dabber', desc: '3D 입체 물감점' },
      { id: 'dabber_textured', name: 'Textured Dabber', icon: 'fa-certificate', type: 'dabber_textured', desc: '거친 입체 질감 점' },
      { id: 'thick_fat_spread', name: 'Fat Spread Knife', icon: 'fa-vector-square', type: 'flat', widthMult: 1.8, desc: '대형 팔레트 나이프' },
      { id: 'thick_flat_smooth', name: 'Flat Smooth', icon: 'fa-square', type: 'flat', widthMult: 1.1, desc: '표준 유화 나이프' },
      { id: 'thick_square', name: 'Square Smooth', icon: 'fa-cubes', type: 'square', widthMult: 0.85, desc: '각진 사각 단면' },
      { id: 'thick_filbert', name: 'Filbert Smooth', icon: 'fa-paintbrush', type: 'filbert', widthMult: 1.0, desc: '부드러운 타원 오일' },
      { id: 'thick_liner', name: 'Liner Smooth', icon: 'fa-pen-fancy', type: 'liner', widthMult: 0.35, desc: '가늘고 뚜렷한 입체선' },
      { id: 'rake_plaster', name: 'Plaster Rake (4줄)', icon: 'fa-bars', type: 'rake', lines: 4, desc: '4줄 갈퀴 결' },
      { id: 'rake_fine', name: 'Fine Rake (7줄)', icon: 'fa-grip-lines', type: 'rake', lines: 7, desc: '7줄 미세 갈퀴 결' },
      { id: 'smudge_3d_pull', name: '3D Pull Smudge', icon: 'fa-hand-pointer', type: '3d_smudge', desc: '3D 물감 늘리기' }
    ];

    // DOM References
    const loginModal = document.getElementById('login-modal');
    const loginForm = document.getElementById('login-form');
    const studentIdInput = document.getElementById('student-id');
    const studentNameInput = document.getElementById('student-name');
    const userBadgeText = document.getElementById('user-badge-text');

    const canvasWrapper = document.getElementById('canvas-wrapper');
    const transformLayer = document.getElementById('canvas-transform-layer');
    const mainCanvas = document.getElementById('main-canvas');
    const mainCtx = mainCanvas.getContext('2d');

    const primaryColorInput = document.getElementById('primary-color');
    const brushSizeInput = document.getElementById('brush-size');
    const brushSizeVal = document.getElementById('brush-size-val');
    const brushOpacityInput = document.getElementById('brush-opacity');
    const brushOpacityVal = document.getElementById('brush-opacity-val');
    const pressureMeterFill = document.getElementById('pressure-meter-fill');
    const pressureMeterVal = document.getElementById('pressure-meter-val');
    const zoomVal = document.getElementById('zoom-val');

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      state.studentId = studentIdInput.value.trim();
      state.studentName = studentNameInput.value.trim();

      // 일부 앱 내장 브라우저는 required 안내창을 못 띄워서 그냥 아무 반응이 없는 것처럼
      // 보일 수 있어 직접 검증하고 토스트로 알려준다.
      if (!state.studentId || !state.studentName) {
        showToast('학번과 이름을 모두 입력해주세요.');
        return;
      }

      userBadgeText.innerText = `${state.studentId} ${state.studentName}`;
      loginModal.classList.add('hidden');
      loginModal.style.display = 'none';
      loginModal.style.pointerEvents = 'none';

      // Auto fit canvas zoom to mobile screen
      state.zoom = Math.min(1.0, (window.innerWidth - 24) / mainCanvas.width);
      updateTransform();
      showToast('스튜디오 입장을 환영합니다!');
    };

    // Mobile Bottom Sheet Navigation
    const drawers = document.querySelectorAll('.mobile-drawer');
    const navBtns = document.querySelectorAll('.nav-tab-btn');

    navBtns.forEach(btn => {
      btn.onclick = () => {
        const targetId = btn.getAttribute('data-target');
        drawers.forEach(d => {
          if (d.id === targetId) {
            d.classList.toggle('open');
          } else {
            d.classList.remove('open');
          }
        });
      };
    });

    document.querySelectorAll('.drawer-close-btn, #btn-close-all').forEach(btn => {
      btn.onclick = () => drawers.forEach(d => d.classList.remove('open'));
    });

    // Render Impasto Grid
    const impastoGrid = document.getElementById('impasto-brush-grid');
    IMPASTO_PRESETS.forEach(preset => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `impasto-preset ${preset.id === state.impastoBrush ? 'active' : ''}`;
      button.dataset.impastoBrush = preset.id;
      button.innerHTML = `
        <div class="impasto-preset-icon"><i class="fa-solid ${preset.icon}"></i></div>
        <div class="text-left overflow-hidden">
          <div class="text-xs font-bold text-slate-200 truncate">${preset.name}</div>
          <div class="text-[9px] text-slate-400 truncate">${preset.desc}</div>
        </div>
      `;
      button.onclick = () => {
        state.impastoBrush = preset.id;
        document.querySelectorAll('.impasto-preset').forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        showToast(`나이프: ${preset.name}`);
      };
      impastoGrid.appendChild(button);
    });

    // Tool switching
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tool = btn.getAttribute('data-tool');
      };
    });

    // MOPV Color Swatches
    const mopvColorGrid = document.getElementById('mopv-color-grid');
    MOPV_COLORS.forEach(color => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mopv-swatch';
      btn.style.backgroundColor = color.hex;
      btn.onclick = () => {
        state.primaryColor = color.hex;
        primaryColorInput.value = color.hex;
        showToast(`색상: ${color.name}`);
      };
      mopvColorGrid.appendChild(btn);
    });

    // Canvas Transform
    function updateTransform() {
      transformLayer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      zoomVal.innerText = `${Math.round(state.zoom * 100)}%`;
    }

    function setZoom(newZoom) {
      state.zoom = Math.min(Math.max(0.4, newZoom), 3.5);
      updateTransform();
    }

    // 2-Finger Touch Pinch Zoom & Pan for Mobile
    let pinchStartDist = 0;
    let pinchStartZoom = 1.0;

    canvasWrapper.addEventListener('touchstart', (e) => {
      drawers.forEach(d => d.classList.remove('open')); // Close drawers when tapping canvas
      if (e.touches.length === 2) {
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartZoom = state.zoom;
      }
    }, { passive: true });

    canvasWrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStartDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        setZoom(pinchStartZoom * (currentDist / pinchStartDist));
      }
    }, { passive: true });

    canvasWrapper.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) pinchStartDist = 0;
    });

    // Impasto & Pastel Engine helpers
    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16) || 0;
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function adjustColorBrightness(hex, factor) {
      const { r, g, b } = hexToRgb(hex);
      const clamp = v => Math.min(255, Math.max(0, Math.round(v * factor)));
      return '#' + [r, g, b].map(v => clamp(v).toString(16).padStart(2, '0')).join('');
    }

    function drawImpastoKnifeStroke(x1, y1, x2, y2, ctx, pressure) {
      const p = Math.max(0.2, pressure);
      const preset = IMPASTO_PRESETS.find(pr => pr.id === state.impastoBrush) || IMPASTO_PRESETS[0];
      const base = state.primaryColor;
      const light = adjustColorBrightness(base, 1.45);
      const shadow = adjustColorBrightness(base, 0.48);

      const dx = x2 - x1, dy = y2 - y1;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      ctx.save();

      if (preset.type === 'dabber' || preset.type === 'dabber_textured') {
        const r = (state.brushSize / 2) * (0.8 + p * 0.4);
        ctx.translate(x2, y2);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = base;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, r * 0.15, r * 0.85, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.strokeStyle = shadow;
        ctx.lineWidth = r * 0.28;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -r * 0.2, r * 0.68, 1.1 * Math.PI, 1.9 * Math.PI);
        ctx.strokeStyle = light;
        ctx.lineWidth = r * 0.25;
        ctx.stroke();
      } else if (preset.type === 'rake') {
        const lines = preset.lines || 4;
        const totalWidth = state.brushSize * (0.8 + p * 0.4);
        const spacing = totalWidth / lines;
        const nx = -Math.sin(angle), ny = Math.cos(angle);

        for (let i = 0; i < lines; i++) {
          const offset = (i - (lines - 1) / 2) * spacing;
          ctx.beginPath();
          ctx.moveTo(x1 + nx * offset, y1 + ny * offset);
          ctx.lineTo(x2 + nx * offset, y2 + ny * offset);
          ctx.strokeStyle = base;
          ctx.lineWidth = Math.max(2, spacing * 0.55);
          ctx.stroke();
        }
      } else {
        const width = state.brushSize * (preset.widthMult || 1.0) * (0.75 + p * 0.45);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = base;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      ctx.restore();
    }

    // Drawing Canvas Loop
    function createNewLayer() {
      const c = document.createElement('canvas');
      c.width = mainCanvas.width; c.height = mainCanvas.height;
      return { canvas: c, ctx: c.getContext('2d') };
    }

    function renderCompositeCanvas() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      mainCtx.fillStyle = '#ffffff';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      state.strokeStack.forEach(layer => mainCtx.drawImage(layer.canvas, 0, 0));
    }

    function saveHistoryState() {
      const snapshot = state.strokeStack.map(l => {
        const copy = createNewLayer();
        copy.ctx.drawImage(l.canvas, 0, 0);
        return copy;
      });
      state.history.push(snapshot);
      state.historyIndex = state.history.length - 1;
    }

    let activeLayer = null;

    function startDrawing(x, y, p) {
      state.isDrawing = true;
      state.lastX = x; state.lastY = y;
      activeLayer = createNewLayer();
      state.strokeStack.push(activeLayer);

      if (state.tool === 'impasto') {
        drawImpastoKnifeStroke(x, y, x, y, activeLayer.ctx, p);
        renderCompositeCanvas();
      }
    }

    function draw(x, y, p) {
      if (!state.isDrawing) return;
      if (state.tool === 'impasto') {
        drawImpastoKnifeStroke(state.lastX, state.lastY, x, y, activeLayer.ctx, p);
      } else {
        activeLayer.ctx.beginPath();
        activeLayer.ctx.moveTo(state.lastX, state.lastY);
        activeLayer.ctx.lineTo(x, y);
        activeLayer.ctx.strokeStyle = state.primaryColor;
        activeLayer.ctx.lineWidth = state.brushSize;
        activeLayer.ctx.lineCap = 'round';
        activeLayer.ctx.globalAlpha = state.opacity;
        activeLayer.ctx.stroke();
      }
      state.lastX = x; state.lastY = y;
      renderCompositeCanvas();
    }

    function stopDrawing() {
      if (state.isDrawing) {
        state.isDrawing = false;
        saveHistoryState();
      }
    }

    canvasWrapper.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const rect = mainCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (mainCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (mainCanvas.height / rect.height);
      startDrawing(x, y, state.pressure);
    });

    canvasWrapper.addEventListener('pointermove', (e) => {
      if (!state.isDrawing) return;
      const rect = mainCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (mainCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (mainCanvas.height / rect.height);
      draw(x, y, state.pressure);
    });

    canvasWrapper.addEventListener('pointerup', stopDrawing);
    canvasWrapper.addEventListener('pointercancel', stopDrawing);

    document.getElementById('undo-btn').onclick = () => {
      if (state.strokeStack.length > 0) {
        state.strokeStack.pop();
        renderCompositeCanvas();
        showToast('이전 단계로 돌아갔습니다.');
      }
    };

    document.getElementById('clear-btn').onclick = () => {
      state.strokeStack = [];
      renderCompositeCanvas();
      showToast('캔버스가 초기화되었습니다.');
    };

    document.getElementById('download-btn').onclick = () => {
      const link = document.createElement('a');
      link.download = `${state.studentId}_오일파스텔.png`;
      link.href = mainCanvas.toDataURL();
      link.click();
    };

    brushSizeInput.oninput = (e) => {
      state.brushSize = parseInt(e.target.value);
      brushSizeVal.innerText = `${state.brushSize}px`;
    };

    brushOpacityInput.oninput = (e) => {
      state.opacity = parseInt(e.target.value) / 100;
      brushOpacityVal.innerText = `${e.target.value}%`;
    };

    primaryColorInput.oninput = (e) => state.primaryColor = e.target.value;

    saveHistoryState();
    renderCompositeCanvas();
  </script>
</body>
</html>
